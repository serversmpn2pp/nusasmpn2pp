<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15477A">
    <title>NUSA | Tidak Terhubung</title>
    <link rel="icon" href="/images/pwa/icon-192.png" type="image/png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7fb; color: #18181b; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(100%, 430px); border: 1px solid #d9e3ee; border-top: 6px solid #f1c40f; border-radius: 8px; background: #fff; box-shadow: 0 18px 48px rgba(21, 71, 122, .12); padding: 30px; text-align: center; }
        img { width: 82px; height: 82px; object-fit: contain; }
        h1 { margin: 18px 0 8px; color: #15477a; font-size: 1.55rem; }
        p { margin: 0; color: #5f6874; line-height: 1.65; }
        button { width: 100%; min-height: 46px; margin-top: 24px; border: 0; border-radius: 8px; background: #15477a; color: #fff; cursor: pointer; font: inherit; font-weight: 750; }
        button:focus-visible { outline: 3px solid rgba(241, 196, 15, .65); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/images/logo-nusa.png" alt="Logo NUSA">
        <h1>Sambungan terputus</h1>
        <p>NUSA memerlukan jaringan untuk membuka data terbaru. Periksa koneksi internet, kemudian coba kembali.</p>
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
</body>
</html>
